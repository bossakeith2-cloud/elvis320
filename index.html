<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width, initial-scale=1.0">
    <title>Document</title>
    <style>
body{
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin: 150px;
}
.container{
background-color: black;
padding: 20px;
border-radius: 10px;
}
.button{
    padding: 15px;
    border-radius: 40px;
    font-size: 30px;
    border:solid black;
    height: 70px;
    width: 70px;
    background-color: rgb(50, 48, 48);
    color: beige;

}

.display{
padding: 40px;
width: 190px;
margin: 15px;
background-color: rgb(50, 48, 48);
border-radius: 25px;
text-align: right;
border: solid black;
font-size: 40px;
color: bisque;


}
#but{
    background-color: orange;
    color: black;
}
.last{
    padding: 15px;
    border-radius: 40px;
    font-size: 30px;
    border:solid black;
    height: 70px;
    width: 145px;
    background-color: rgb(50, 48, 48);
    color: beige;
}
.dead{
     padding: 15px;
    border-radius: 40px;
    font-size: 30px;
    border:solid black;
    height: 70px;
    width: 70px;
    background-color: rgb(131, 127, 127);
    color: black;
}

    </style>
</head>
<body>
    <div class="container">
        <input type="text" class="display" name="under" value="0">
<div>
 <button class="dead" type="button" >AC</button>
 <button class="button" type="button">00</button>
 <button class="button" type="button">%</button>
 <button class="button" type="button" id="but">/</button><br><br>
</div>
<div>
 <button class="button" type="button">7</button>
 <button class="button" type="button">8</button>
 <button class="button" type="button">9</button>
 <button class="button" type="button" id="but">x</button><br><br>
</div>
<div>
 <button class="button" type="button">4</button>
 <button class="button" type="button">5</button>
 <button class="button" type="button">6</button>
 <button class="button" type="button" id="but">-</button><br><br>
</div>
<div>
 <button class="button" type="button">1</button>
 <button class="button" type="button">2</button>
 <button class="button" type="button">3</button>
 <button class="button" type="button" id="but">+</button><br><br>
</div>
<div>
 <button class="last" type="button">0</button>
 <button class="button" type="button">.</button>
 <button class="button" type="button" id="but">=</button><br><br>
</div>
    </div>
</body>
